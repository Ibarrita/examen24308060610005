{% extends "base.html" %}

{% block content %}
<h1 class="text-center">Tareas</h1>
<div class="dropdown">
    <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        {{session.get("nombre")}}
    </button>
    <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="/perfil">Perfil</a></li>
        <li><a class="dropdown-item" href="/">Cerrar sesión</a></li>
    </ul>
</div>
<button class="btn btn-primary">Agregar tarea</button>
<button class="btn btn-primary">Agregar etiqueta</button>
<button class="btn btn-danger">Eliminar tarea</button>
<!--Lo de la tabla lo aprendí en freeCodeCamp y la documentación de Bootstrap, no use IA-->
<table class="table table-striped">
    <thead>
        <tr>
            <th scope="col">Tareas</th>
            <th scope="col">Etiqueta</th>
            <th scope="col">Estado</th>
        </tr>
    </thead>
</table>
{% endblock %}
